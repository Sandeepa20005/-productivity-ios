name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Prepare Mobile Web Assets
        run: |
          node build-mobile.js

      - name: Compile iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa File
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r derived_data/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../ProductivityTracker.ipa Payload
          cd ../..
          ls -lh ProductivityTracker.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductivityTracker-iOS-IPA
          path: ProductivityTracker.ipa
          retention-days: 14
